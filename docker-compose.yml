# ═══ Docker Compose ═══
# 以下变量从 .env 读取（或通过环境变量覆盖）：
#   DOWNLOAD_MODEL  — 构建时下载 BGE 模型（true/false）
#   HF_ENDPOINT     — HuggingFace 镜像地址
#   FRONTEND_PORT   — 前端暴露端口

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOWNLOAD_MODEL: "${DOWNLOAD_MODEL:-true}"
        HF_ENDPOINT: "${HF_ENDPOINT:-https://hf-mirror.com}"
    container_name: yinghui-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: yinghui-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
